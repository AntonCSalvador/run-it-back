name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      snapshot_candidate:
        description: Generate Linux visual snapshot candidate artifacts
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.snapshot_candidate != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          PLAYWRIGHT_TEST_BUILD: "1"
      - run: npm run smoke:static
      - run: PLAYWRIGHT_PREBUILT=1 npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  snapshot-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.snapshot_candidate == true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          PLAYWRIGHT_TEST_BUILD: "1"
      - run: PLAYWRIGHT_PREBUILT=1 npx playwright test e2e/free-play.spec.ts --grep "captures the complete Free Play journey" --update-snapshots
      - run: PLAYWRIGHT_PREBUILT=1 npx playwright test e2e/free-play.spec.ts --grep "captures the complete Free Play journey"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-snapshot-candidate
          path: |
            e2e/__screenshots__/linux/**
            playwright-report
            test-results
          if-no-files-found: ignore
